name: IndexNow

# Production yayını başarıyla bitince güncel sayfaları Bing/Yandex'e bildirir
# (ChatGPT araması ve Copilot Bing indeksini kullanır).
on: deployment_status

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow bildirimi
        run: |
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"emirtiryaki.com","key":"17fec15c363c9ba1b0f0b3e7493b271c","keyLocation":"https://emirtiryaki.com/17fec15c363c9ba1b0f0b3e7493b271c.txt","urlList":["https://emirtiryaki.com/","https://emirtiryaki.com/en","https://emirtiryaki.com/projects","https://emirtiryaki.com/projects/kortbul/expo","https://emirtiryaki.com/projects/dacar/mobile","https://emirtiryaki.com/cv.html","https://emirtiryaki.com/cv-en.html","https://emirtiryaki.com/llms.txt"]}'
